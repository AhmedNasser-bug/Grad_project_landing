<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cardiac Resonance — Generative Heartbeat Viewer</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/p5.js/1.7.0/p5.min.js"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600&family=Lora:wght@400;500&display=swap" rel="stylesheet">
    <style>
        :root {
            --anthropic-dark: #141413;
            --anthropic-light: #faf9f5;
            --anthropic-mid-gray: #b0aea5;
            --anthropic-light-gray: #e8e6dc;
            --anthropic-orange: #d97757;
            --anthropic-blue: #004ac6;
            --anthropic-green: #10b981;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Poppins', sans-serif;
            background: linear-gradient(135deg, var(--anthropic-light) 0%, #f5f3ee 100%);
            min-height: 100vh;
            color: var(--anthropic-dark);
        }

        .container {
            display: flex;
            min-height: 100vh;
            padding: 20px;
            gap: 20px;
        }

        .sidebar {
            width: 340px;
            flex-shrink: 0;
            background: rgba(255, 255, 255, 0.95);
            backdrop-filter: blur(10px);
            padding: 24px;
            border-radius: 12px;
            box-shadow: 0 10px 30px rgba(20, 20, 19, 0.1);
            overflow-y: auto;
            overflow-x: hidden;
        }

        .sidebar h1 {
            font-family: 'Lora', serif;
            font-size: 22px;
            font-weight: 500;
            color: var(--anthropic-dark);
            margin-bottom: 6px;
        }

        .sidebar .subtitle {
            color: var(--anthropic-mid-gray);
            font-size: 13px;
            margin-bottom: 28px;
            line-height: 1.4;
        }

        .control-section {
            margin-bottom: 28px;
        }

        .control-section h3 {
            font-size: 15px;
            font-weight: 600;
            color: var(--anthropic-dark);
            margin-bottom: 14px;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .control-section h3::before {
            content: '•';
            color: var(--anthropic-orange);
            font-weight: bold;
        }

        .seed-input {
            width: 100%;
            background: var(--anthropic-light);
            padding: 10px;
            border-radius: 8px;
            font-family: 'Courier New', monospace;
            font-size: 14px;
            margin-bottom: 10px;
            border: 1px solid var(--anthropic-light-gray);
            text-align: center;
        }

        .seed-controls {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 8px;
            margin-bottom: 8px;
        }

        .control-group {
            margin-bottom: 18px;
        }

        .control-group label {
            display: block;
            font-size: 13px;
            font-weight: 500;
            color: var(--anthropic-dark);
            margin-bottom: 6px;
        }

        .slider-container {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .slider-container input[type="range"] {
            flex: 1;
            height: 4px;
            background: var(--anthropic-light-gray);
            border-radius: 2px;
            outline: none;
            -webkit-appearance: none;
        }

        .slider-container input[type="range"]::-webkit-slider-thumb {
            -webkit-appearance: none;
            width: 16px;
            height: 16px;
            background: var(--anthropic-orange);
            border-radius: 50%;
            cursor: pointer;
        }

        .value-display {
            font-family: 'Courier New', monospace;
            font-size: 12px;
            color: var(--anthropic-mid-gray);
            min-width: 55px;
            text-align: right;
        }

        .button {
            background: var(--anthropic-orange);
            color: white;
            border: none;
            padding: 10px 16px;
            border-radius: 6px;
            font-size: 13px;
            font-weight: 500;
            cursor: pointer;
            width: 100%;
            transition: all 0.2s ease;
        }

        .button:hover {
            background: #c86641;
        }

        .button.secondary {
            background: var(--anthropic-blue);
        }

        .button.tertiary {
            background: var(--anthropic-green);
        }

        .canvas-area {
            flex: 1;
            display: flex;
            align-items: center;
            justify-content: center;
            min-width: 0;
        }

        #canvas-container {
            width: 100%;
            max-width: 950px;
            border-radius: 12px;
            overflow: hidden;
            box-shadow: 0 20px 40px rgba(20, 20, 19, 0.1);
            background: #0b1c30;
            position: relative;
        }

        #canvas-container canvas {
            display: block;
            width: 100% !important;
            height: auto !important;
        }

        .hero-text-overlay {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            text-align: center;
            color: white;
            pointer-events: none;
            z-index: 10;
            width: 85%;
        }

        .hero-text-overlay h2 {
            font-family: 'Lora', serif;
            font-size: 38px;
            font-weight: 500;
            letter-spacing: -0.02em;
            margin-bottom: 8px;
            text-shadow: 0 4px 20px rgba(0,0,0,0.6);
        }

        .hero-text-overlay p {
            font-size: 15px;
            opacity: 0.85;
            font-family: 'Poppins', sans-serif;
            text-shadow: 0 2px 10px rgba(0,0,0,0.6);
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="sidebar">
            <h1>Cardiac Resonance</h1>
            <div class="subtitle">Generative p5.js Heartbeat Morphing Engine</div>

            <div class="control-section">
                <h3>Seed</h3>
                <input type="number" id="seed-input" class="seed-input" value="42069" onchange="updateSeed()">
                <div class="seed-controls">
                    <button class="button secondary" onclick="previousSeed()">← Prev</button>
                    <button class="button secondary" onclick="nextSeed()">Next →</button>
                </div>
                <button class="button tertiary" onclick="randomSeedAndUpdate()">↻ Random Seed</button>
            </div>

            <div class="control-section">
                <h3>Telemetry Parameters</h3>
                
                <div class="control-group">
                    <label>Criticality Level (%)</label>
                    <div class="slider-container">
                        <input type="range" id="criticality" min="0" max="100" step="1" value="15" oninput="updateParam('criticality', this.value)">
                        <span class="value-display" id="criticality-value">15%</span>
                    </div>
                </div>

                <div class="control-group">
                    <label>Heart Rate (BPM)</label>
                    <div class="slider-container">
                        <input type="range" id="bpm" min="40" max="160" step="1" value="72" oninput="updateParam('bpm', this.value)">
                        <span class="value-display" id="bpm-value">72</span>
                    </div>
                </div>

                <div class="control-group">
                    <label>Signal Glow Radius</label>
                    <div class="slider-container">
                        <input type="range" id="glowRadius" min="5" max="40" step="1" value="18" oninput="updateParam('glowRadius', this.value)">
                        <span class="value-display" id="glowRadius-value">18px</span>
                    </div>
                </div>

                <div class="control-group">
                    <label>HRV Noise Scale</label>
                    <div class="slider-container">
                        <input type="range" id="hrvNoise" min="0" max="50" step="1" value="12" oninput="updateParam('hrvNoise', this.value)">
                        <span class="value-display" id="hrvNoise-value">12</span>
                    </div>
                </div>

                <div class="control-group">
                    <label>Line Thickness</label>
                    <div class="slider-container">
                        <input type="range" id="strokeWeight" min="1" max="6" step="0.5" value="2.5" oninput="updateParam('strokeWeight', this.value)">
                        <span class="value-display" id="strokeWeight-value">2.5</span>
                    </div>
                </div>
            </div>

            <div class="control-section">
                <h3>Actions</h3>
                <button class="button" onclick="resetParameters()">Reset Defaults</button>
            </div>
        </div>

        <div class="canvas-area">
            <div id="canvas-container">
                <div class="hero-text-overlay">
                    <h2>Integrated Hemodialysis Digitization</h2>
                    <p>Clinical Decision Support & Real-Time Telemetry Framework</p>
                </div>
            </div>
        </div>
    </div>

    <script>
        let params = {
            seed: 42069,
            criticality: 15, // 0..100
            bpm: 72,
            glowRadius: 18,
            hrvNoise: 12,
            strokeWeight: 2.5
        };

        let defaultParams = { ...params };
        let xPos = 0;
        let pqrstPoints = [];
        let timeStep = 0;

        function setup() {
            let canvas = createCanvas(1200, 600);
            canvas.parent('canvas-container');
            frameRate(60);
            initializeSystem();
        }

        function initializeSystem() {
            randomSeed(params.seed);
            noiseSeed(params.seed);
            background(11, 28, 48); // Deep Slate Medical Background (#0B1C30)
            xPos = 0;
            pqrstPoints = [];
        }

        function draw() {
            // Soft fading trail for comfy ambient background behind Hero text
            background(11, 28, 48, 28);

            // Compute dynamic colors based on criticality parameter
            let critNorm = params.criticality / 100.0;
            
            // Interpolate colors: Stable (Teal/Blue #10B981 -> #004AC6) -> Warning (Amber #F59E0B) -> Critical (Red #EF4444)
            let baseColor, glowColor;
            if (critNorm < 0.4) {
                let t = critNorm / 0.4;
                baseColor = lerpColor(color(16, 185, 129), color(0, 74, 198), t);
                glowColor = color(0, 74, 198, 90);
            } else if (critNorm < 0.75) {
                let t = (critNorm - 0.4) / 0.35;
                baseColor = lerpColor(color(0, 74, 198), color(245, 158, 11), t);
                glowColor = color(245, 158, 11, 110);
            } else {
                let t = (critNorm - 0.75) / 0.25;
                baseColor = lerpColor(color(245, 158, 11), color(239, 68, 68), t);
                glowColor = color(239, 68, 68, 140);
            }

            // Draw underlying grid lines (subtle medical ECG grid)
            drawEcgGrid();

            // Calculate heart pulse position
            let speed = (params.bpm / 60) * 4.5;
            xPos += speed;
            if (xPos > width) {
                xPos = 0;
                pqrstPoints = [];
            }

            // Generate Y position using Gaussian PQRST pulse equation + Perlin HRV
            let wavePhase = (xPos % 280) / 280; // Pulse wavelength span
            let baseY = height * 0.55;
            let pulseY = baseY;

            // PQRST Complex Gaussian Spline formula
            if (wavePhase > 0.15 && wavePhase < 0.22) {
                // P Wave
                pulseY -= sin((wavePhase - 0.15) / 0.07 * PI) * 16;
            } else if (wavePhase >= 0.25 && wavePhase < 0.27) {
                // Q Dip
                pulseY += (wavePhase - 0.25) / 0.02 * 14;
            } else if (wavePhase >= 0.27 && wavePhase < 0.32) {
                // R Peak (Main Contraction)
                let rProgress = (wavePhase - 0.27) / 0.05;
                let amp = 140 + (critNorm * 50); // Height swells under criticality
                pulseY -= sin(rProgress * PI) * amp;
            } else if (wavePhase >= 0.32 && wavePhase < 0.35) {
                // S Dip
                pulseY += sin((wavePhase - 0.32) / 0.03 * PI) * 22;
            } else if (wavePhase >= 0.42 && wavePhase < 0.55) {
                // T Wave (Repolarization)
                pulseY -= sin((wavePhase - 0.42) / 0.13 * PI) * 28;
            }

            // Add Perlin noise for subtle HRV organic micro-vibration
            timeStep += 0.02;
            let hrvOffset = (noise(timeStep, xPos * 0.005) - 0.5) * params.hrvNoise;
            pulseY += hrvOffset;

            // Save point
            pqrstPoints.push({ x: xPos, y: pulseY });
            if (pqrstPoints.length > 500) {
                pqrstPoints.shift();
            }

            // Render Glow Layer (Comfy-to-the-eye aura)
            noFill();
            stroke(glowColor);
            strokeWeight(params.glowRadius);
            strokeJoin(ROUND);
            strokeCap(ROUND);
            beginShape();
            for (let pt of pqrstPoints) {
                vertex(pt.x, pt.y);
            }
            endShape();

            // Render Crisp Core Line
            stroke(baseColor);
            strokeWeight(params.strokeWeight);
            beginShape();
            for (let pt of pqrstPoints) {
                vertex(pt.x, pt.y);
            }
            endShape();

            // Draw leading scanner pulse point
            fill(baseColor);
            noStroke();
            ellipse(xPos, pulseY, 8 + (critNorm * 6), 8 + (critNorm * 6));
        }

        function drawEcgGrid() {
            stroke(255, 255, 255, 12);
            strokeWeight(1);
            let gridStep = 40;
            for (let x = 0; x < width; x += gridStep) {
                line(x, 0, x, height);
            }
            for (let y = 0; y < height; y += gridStep) {
                line(0, y, width, y);
            }
        }

        function updateParam(paramName, val) {
            let numVal = parseFloat(val);
            params[paramName] = numVal;
            let display = document.getElementById(paramName + '-value');
            if (display) {
                if (paramName === 'criticality') display.textContent = numVal + '%';
                else if (paramName === 'glowRadius') display.textContent = numVal + 'px';
                else display.textContent = numVal;
            }
        }

        function updateSeedDisplay() {
            document.getElementById('seed-input').value = params.seed;
        }

        function updateSeed() {
            let input = document.getElementById('seed-input');
            let newSeed = parseInt(input.value);
            if (newSeed && newSeed > 0) {
                params.seed = newSeed;
                initializeSystem();
            }
        }

        function previousSeed() {
            params.seed = Math.max(1, params.seed - 1);
            updateSeedDisplay();
            initializeSystem();
        }

        function nextSeed() {
            params.seed = params.seed + 1;
            updateSeedDisplay();
            initializeSystem();
        }

        function randomSeedAndUpdate() {
            params.seed = Math.floor(Math.random() * 999999) + 1;
            updateSeedDisplay();
            initializeSystem();
        }

        function resetParameters() {
            params = { ...defaultParams };
            document.getElementById('criticality').value = params.criticality;
            document.getElementById('criticality-value').textContent = params.criticality + '%';
            document.getElementById('bpm').value = params.bpm;
            document.getElementById('bpm-value').textContent = params.bpm;
            document.getElementById('glowRadius').value = params.glowRadius;
            document.getElementById('glowRadius-value').textContent = params.glowRadius + 'px';
            document.getElementById('hrvNoise').value = params.hrvNoise;
            document.getElementById('hrvNoise-value').textContent = params.hrvNoise;
            document.getElementById('strokeWeight').value = params.strokeWeight;
            document.getElementById('strokeWeight-value').textContent = params.strokeWeight;
            updateSeedDisplay();
            initializeSystem();
        }
    </script>
</body>
</html>
