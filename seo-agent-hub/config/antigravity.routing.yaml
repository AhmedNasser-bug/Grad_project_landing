# Universal Agent Adapter Handshake & Execution Routing (WAF REL-03 Compliant)
# Manages primary Antigravity remote sessions, sunsetting Jules fallback, and future agent adapters.
version: "2.0"
adapter_policy:
  primary_adapter: "antigravity"
  sunsetting_adapter: "jules"
  sunset_scheduled: true
  sunset_notice: "Google Jules is scheduled for sunset. Antigravity remote sessions is the active primary engine."
  request_timeout_ms: 5000
  max_retries: 3
  backoff_strategy: "exponential_jitter"

workflows:
  orchestration:
    primary_adapter: "antigravity"
    fallback_adapter: "jules"
    mcp_servers:
      - sqlite
      - stitch
  web_reconnaissance:
    primary_adapter: "antigravity"
    fallback_adapter: "jules"
    mcp_servers:
      - firecrawl
      - sqlite
    skills:
      - ./skills/firecrawl-skills/skills/workflows/firecrawl-competitive-intel/SKILL.md
      - ./skills/open-seo/.agents/skills/competitor-analysis/SKILL.md
  academic_discovery:
    primary_adapter: "antigravity"
    fallback_adapter: "jules"
    mcp_servers:
      - arxiv
      - sqlite
    skills:
      - ./skills/firecrawl-skills/skills/workflows/firecrawl-research-papers/SKILL.md
      - ./skills/open-seo/.agents/skills/keyword-research/SKILL.md
  stitch_page_generation:
    primary_adapter: "antigravity"
    fallback_adapter: "jules"
    mcp_servers:
      - stitch
      - sqlite
    skills:
      - ./skills/stitch-skills/plugins/stitch-utilities/skills/stitch-loop/SKILL.md
      - ./skills/stitch-skills/plugins/stitch-design/skills/generate-design/SKILL.md
  seo_validation:
    primary_adapter: "antigravity"
    fallback_adapter: "jules"
    mcp_servers:
      - openseo
      - sqlite
    skills:
      - ./skills/open-seo/.agents/skills/seo-audit/SKILL.md
      - ./skills/claude-seo/skills/seo-audit/SKILL.md
      - ./skills/agentic-seo-skill/SKILL.md
